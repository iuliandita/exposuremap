services:
  web:
    image: nginx:1.29
    ports:
      - "8080:80"
      - name: tls
        target: 443
        published: "8443"
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - front
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
  worker:
    image: busybox:1.37
    privileged: true
    volumes:
      - type: bind
        source: /srv/data
        target: /data
  database:
    image: postgres:18
  host:
    image: busybox:1.37
    network_mode: host

networks:
  front:
